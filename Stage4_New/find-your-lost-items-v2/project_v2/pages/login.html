<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - Find Your Lost Items</title>
  <!-- Order matters: Bootstrap first, then icons, then OUR style.css (the last one wins) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-root="../">

  <!-- ===== NAVBAR =====
       The phone menu works with CSS only: a hidden checkbox + a label (no Bootstrap JavaScript) -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-lf sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html"><i class="bi bi-search"></i> Find Your Lost Items</a>
      <input type="checkbox" id="menuToggle" class="menu-toggle" aria-hidden="true">
      <label for="menuToggle" class="navbar-toggler" aria-label="Open or close the menu"><span class="navbar-toggler-icon"></span></label>
      <div class="navbar-collapse menu-links">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="items.html">Items</a></li>
          <li class="nav-item"><a class="nav-link" href="report.html">Report</a></li>
          <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
          <li class="nav-item"><a class="nav-link" href="heroes.html">Heroes</a></li>
          <li class="nav-item"><a class="nav-link active" id="navLogin" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link btn-register" id="navRegister" href="register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h2 class="text-center page-title mb-4">Login</h2>

            <div id="formMessage"></div>

            <!-- The browser checks "required" and "type=email" by itself (HTML5 validation) -->
            <form id="loginForm">
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" placeholder="At least 6 characters" required>
              </div>
              <button type="submit" class="btn btn-lf w-100">Login</button>
            </form>

            <p class="text-center mt-3 mb-0">Don't have an account? <a href="register.html">Register here</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer-lf text-center py-4">
    <div class="container">
      <p class="mb-1"><i class="bi bi-trophy-fill"></i> Every returned item makes our campus better. <a href="heroes.html">Meet the Finder Heroes</a></p>
      <small>&copy; 2026 Find Your Lost Items | Basic Web Development Project</small>
    </div>
  </footer>

  <!-- Our JavaScript. Order matters: data and helpers first, the page script last -->
  <script src="../js/storage.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
