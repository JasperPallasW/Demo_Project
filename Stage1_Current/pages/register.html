  <!-- ===== MAIN CONTENT ===== -->
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h2 class="text-center page-title mb-4">Create Account</h2>

            <form id="registerForm" onsubmit="event.preventDefault(); alert('Form is valid. JavaScript will be added later.');">
              <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" minlength="3" required>
              </div>
              <div class="mb-3">
                <label for="studentId" class="form-label">Student ID</label>
                <input type="text" class="form-control" id="studentId" required>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
              </div>
              <div class="mb-3">
                <label for="phone" class="form-label">WhatsApp Number</label>
                <input type="tel" class="form-control" id="phone" pattern="[0-9]{10,13}"
                       title="Use 10 to 13 digits, numbers only" placeholder="911234567890" required>
                <div class="form-text">Used only so the owner or finder can contact you.</div>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" minlength="6" required>
              </div>
              <div class="mb-3">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
              </div>
              <button type="submit" class="btn btn-lf w-100">Register</button>
            </form>

            <p class="text-center mt-3 mb-0">
              Already have an account? <a href="login.html">Login here</a>
            </p>
          </div>
        </div>
      </div>
    </div>
  </main>
