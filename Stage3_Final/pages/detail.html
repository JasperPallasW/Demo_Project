<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Item Detail - Find Your Lost Items</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <!-- style.css must come AFTER Bootstrap, so our styles win -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
  <!-- ===== NAVBAR ===== -->
  <nav class="navbar navbar-expand-lg navbar-dark navbar-lf">
    <div class="container">
      <a class="navbar-brand fw-bold" href="../index.html">Find Your Lost Items</a>
      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse" data-bs-target="#mainMenu"
              aria-controls="mainMenu" aria-expanded="false" aria-label="Toggle menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="items.html">Items</a></li>
          <li class="nav-item"><a class="nav-link" href="report.html">Report</a></li>
          <li class="nav-item"><a class="nav-link" href="map.html">Map</a></li>
          <li class="nav-item"><a class="nav-link" href="history.html">History</a></li>
          <li class="nav-item"><a class="nav-link" id="navLogin" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link btn-register" id="navRegister" href="register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ===== MAIN CONTENT ===== -->
  <main class="container py-5">
    <a href="items.html" class="btn btn-outline-secondary btn-sm mb-4">&larr; Back to items</a>

    <!-- Shown when the item id in the address is wrong -->
    <div id="detailNotFound" class="alert alert-danger d-none">
      Item not found. <a href="items.html">Go back to the item list</a>.
    </div>

    <!-- Filled by detail.js -->
    <div id="detailContent" class="row g-4 d-none">
      <div class="col-md-5">
        <img id="detailImage" class="detail-photo shadow-sm" src="../images/placeHolder.svg" alt="Item photo">
      </div>
      <div class="col-md-7">
        <span id="detailStatus" class="badge mb-2"></span>
        <h2 id="detailName" class="page-title"></h2>
        <p id="detailDescription"></p>
        <ul class="list-unstyled">
          <li><strong>Category:</strong> <span id="detailCategory"></span></li>
          <li><strong>Location:</strong> <span id="detailLocation"></span></li>
          <li><strong>Date:</strong> <span id="detailDate"></span></li>
          <li><strong>Reported by:</strong> <span id="detailReporter"></span></li>
        </ul>
        <div id="actionBox" class="mb-3"></div>
        <div id="matchBox"></div>
      </div>
    </div>
  </main>

  <!-- ===== FOOTER ===== -->
  <footer class="footer-lf text-center py-3">
    <div class="container">
      <small>&copy; 2026 Find Your Lost Items | Basic Web Development Project</small>
    </div>
  </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/matching.js"></script>
    <script src="../js/detail.js"></script>
</body>
</html>
